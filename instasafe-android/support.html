<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support | InstaSafe Pro</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #141314; color: white; line-height: 1.6; }
        
        body.lang-tr .en-content { display: none !important; }
        body.lang-en .tr-content { display: none !important; }

        nav { padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #242224; background: #0d0c0d; }
        .logo { font-weight: 800; font-size: 1.5rem; text-decoration: none; color: white; }
        .nav-right { display: flex; align-items: center; gap: 20px; }
        .back-link { text-decoration: none; color: #888; font-size: 0.9rem; transition: 0.3s; }
        .back-link:hover { color: white; }
        .lang-btn { background: #242224; border: 1px solid #3d3a3d; color: white; padding: 6px 14px; border-radius: 50px; cursor: pointer; font-weight: 600; font-size: 0.8rem; }
        .lang-btn:hover { background: white; color: black; }

        .form-container { max-width: 550px; margin: 50px auto; padding: 40px 30px; background: #242224; border: 1px solid #363436; border-radius: 24px; box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
        .form-title { text-align: center; font-size: 2.2rem; font-weight: 800; margin-bottom: 5px; color: white; }
        .form-divider { width: 100%; height: 2px; background: linear-gradient(90deg, #ff4b6b, #dc2743); margin: 15px 0 30px; border-radius: 2px; }

        .form-group { margin-bottom: 22px; display: flex; flex-direction: column; }
        label { font-weight: 600; font-size: 0.95rem; margin-bottom: 8px; color: #ccc; }
        
        input[type="text"], input[type="email"], textarea { background: #161516; border: 1px solid #3d3a3d; border-radius: 12px; padding: 14px 16px; color: white; font-size: 1rem; font-weight: 500; transition: 0.3s; width: 100%; }
        input:focus, textarea:focus { border-color: #ff4b6b; outline: none; background: #1a191a; box-shadow: 0 0 10px rgba(220, 39, 67, 0.15); }

        /* Gönder Butonu */
        .submit-btn { width: 100%; padding: 16px; background: #0095f6; color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 1.1rem; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(0, 149, 246, 0.2); margin-top: 10px; }
        .submit-btn:hover:not(:disabled) { background: #1aa1f7; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 149, 246, 0.4); }
        .submit-btn:disabled { background: #444; color: #888; cursor: not-allowed; box-shadow: none; }

        footer { text-align: center; padding: 40px 20px; color: #555; font-size: 0.85rem; }
    </style>
</head>
<body class="lang-tr">

    <nav>
        <a href="index.html" class="logo">InstaSafe Pro</a>
        <div class="nav-right">
            <a href="index.html" class="back-link tr-content">&larr; Uygulama Sayfasına Dön</a>
            <a href="index.html" class="back-link en-content">&larr; Back to App Main</a>
            <button class="lang-btn" id="lang-toggle">EN</button>
        </div>
    </nav>

    <div class="form-container">
        <h1 class="form-title tr-content">Destek Talebi</h1>
        <h1 class="form-title en-content">Contact support</h1>
        <div class="form-divider"></div>

        <form id="support-form">
            
            <div class="form-group">
                <label class="tr-content" for="name">Adınız Soyadınız</label>
                <label class="en-content" for="name">Full name</label>
                <input type="text" id="name" name="name" required placeholder="Adınız Soyadınız">
            </div>

            <div class="form-group">
                <label class="tr-content" for="email">E-posta Adresiniz</label>
                <label class="en-content" for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="ornek@eposta.com">
            </div>

            <div class="form-group">
                <label class="tr-content" for="subject">Konu</label>
                <label class="en-content" for="subject">Subject</label>
                <input type="text" id="subject" name="subject" readonly value="InstaSafe Pro - Mobil Destek Talebi">
            </div>

            <div class="form-group">
                <label class="tr-content" for="message">Talebinizi Açıklayın</label>
                <label class="en-content" for="message">Describe your request:</label>
                <textarea id="message" name="message" rows="6" required></textarea>
            </div>

            <button type="submit" id="submit-btn" class="submit-btn">
                <span class="tr-content">Gönder</span>
                <span class="en-content">Sent</span>
            </button>
        </form>
    </div>

    <footer>
        BYOnTheGo Software Studio &copy; 2026.
    </footer>

    <script>
        // Dil Değiştirme Arayüz Yönetimi
        const langBtn = document.getElementById('lang-toggle');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const subjectInput = document.getElementById('subject');

        function updatePlaceholders(lang) {
            if (lang === 'tr') {
                document.body.className = 'lang-tr';
                langBtn.innerText = 'EN';
                subjectInput.value = "InstaSafe Pro - Mobil Destek Talebi";
                nameInput.placeholder = "Adınız Soyadınız";
                emailInput.placeholder = "ornek@eposta.com";
            } else {
                document.body.className = 'lang-en';
                langBtn.innerText = 'TR';
                subjectInput.value = "InstaSafe Pro - Mobile Support Request";
                nameInput.placeholder = "Your Full Name";
                emailInput.placeholder = "example@email.com";
            }
        }

        langBtn.addEventListener('click', () => {
            const currentLang = document.body.classList.contains('lang-tr') ? 'en' : 'tr';
            localStorage.setItem('instasafe-lang', currentLang);
            updatePlaceholders(currentLang);
        });

        // Sayfa İlk Açıldığında Dili Hatırla
        const savedLang = localStorage.getItem('instasafe-lang') || 'tr';
        updatePlaceholders(savedLang);

        // Form Gönderme ve Doğrudan Web3Forms API Akışı
        const form = document.getElementById('support-form');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const isTr = document.body.classList.contains('lang-tr');

            // Butonu kilitle ve yükleme moduna al
            submitBtn.disabled = true;
            submitBtn.innerText = isTr ? "Gönderiliyor..." : "Sending...";

            // FormData Paketini Oluştur
            const formData = new FormData();
            
            // Web3Forms Doğrulanmış Canlı Erişim Anahtarı
            formData.append("access_key", "5f1f954e-9c77-4ca3-9050-958741b0fac9");
            
            formData.append("name", nameInput.value);
            formData.append("email", emailInput.value);
            formData.append("subject", subjectInput.value);
            formData.append("message", document.getElementById('message').value);

            try {
                const response = await fetch("https://api.web3forms.com/submit", {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    alert(isTr ? "Destek talebiniz başarıyla e-posta adresimize iletildi!" : "Your support ticket has been successfully sent to our email!");
                    form.reset();
                    updatePlaceholders(localStorage.getItem('instasafe-lang') || 'tr');
                } else {
                    throw new Error(result.message || "API Error");
                }

            } catch (error) {
                console.error("Gönderim hatası: ", error);
                alert(isTr ? "E-posta gönderilirken bir sorun oluştu. Lütfen daha sonra tekrar deneyin." : "An error occurred while sending email. Please try again later.");
            } finally {
                // Her durumda butonu eski haline getirerek kilitlenmeyi önle
                submitBtn.disabled = false;
                submitBtn.innerHTML = isTr ? `<span class="tr-content">Gönder</span>` : `<span class="en-content">Sent</span>`;
            }
        });
    </script>
</body>
</html>
